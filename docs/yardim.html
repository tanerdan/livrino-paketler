<html lang="tr">
<head>
<meta charset="utf-8">

<title>Livrino — Yardım</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Yardım / SSS (04.11.2026, kullanıcı onayı). 4 dil, çevrimdışı; dil: ?ui= > raftaki seçim (aicomics.ui) > cihaz > tr */
:root { --bg: #F6F2EA; --surface: #FFFFFF; --ink: #15171A; --muted: #5E5A52; --line: #E2DCCF; --accent: #8C2F39; --accent-fg: #FFFFFF; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --surface: #1D1D21; --ink: #ECE8DE; --muted: #A9A398; --line: #2E2D31; --accent: #C2525E; --accent-fg: #FFFFFF; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Work Sans", system-ui, sans-serif; font-size: 15.5px; line-height: 1.55; }
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: var(--bg); border-bottom: 1px solid var(--line); }
header button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px 6px; font: inherit; font-size: 18px; line-height: 1; }
header h1 { margin: 0; font-family: "Bodoni Moda", Georgia, serif; font-size: 21px; font-weight: 600; flex: 1; }
.seg { display: flex; gap: 2px; }
.seg button { font-size: 12px; padding: 4px 8px; border-radius: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
main { max-width: 680px; margin: 0 auto; padding: 8px 16px calc(env(safe-area-inset-bottom) + 32px); }
h2 { font-family: "Bodoni Moda", Georgia, serif; font-size: 18px; margin: 24px 0 8px; color: var(--accent); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: flex-start; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; color: var(--accent); font-weight: 700; width: 12px; flex: none; }
details[open] summary::before { content: "–"; }
.cevap { padding: 0 14px 12px 34px; }
.cevap p { margin: 0 0 8px; }
.cevap ul, .cevap ol { margin: 0 0 8px; padding-left: 20px; }
a { color: var(--accent); }
.alt { margin-top: 28px; font-size: 13.5px; color: var(--muted); }
</style>
</head>

<header>
  <button id="geri" type="button">‹</button>
  <h1 id="baslik">Yardım</h1>
  <div class="seg" id="dil" role="group"></div>
</header>
<main id="icerik"></main>

        ["Plus ve satın alma", [
          ["Livrino Plus neler açar?", "<p>Tüm kitapların tüm bölümlerini, B1 ve A2 seviyelerini, sesli okumayı, sözlüğü ve yeni kitaplara ilk 7 gün erişimi.</p>"],
          ["Hangi seçenekler var?", "<ul><li>Aylık Plus</li><li>Yıllık Plus: 14 gün ücretsiz denemeyle başlar</li><li>Tek kitap: o kitabın tüm bölümleri ve özellikleri, süresiz</li></ul><p>Fiyatlar satın alma ekranında kendi para biriminle görünür. Ödeme Google Play üzerinden yapılır.</p>"],
          ["Deneme bitince ne olur?", "<p>Yıllık plan otomatik başlar ve ücret Google Play hesabından alınır. Deneme bitmeden ve her yıllık yenilemeden 2 gün önce sana hatırlatma göndeririz; istemezsen o tarihe kadar iptal edebilirsin.</p>"],

    en: { title: "Help & FAQ", back: "Back to the bookshelf", alt: "Didn't find your answer? Write to us: ",

        ["Reading", [

          ["¿Qué es el texto doble (+TR)?", "<p>Muestra la frase en un idioma que conoces, en letra pequeña bajo el bocadillo. Si te atascas leyendo en el idioma que aprendes, ves el significado al instante.</p>"],

  const DILLER = ["tr", "en", "de", "es"];
  const q = new URLSearchParams(location.search);
  let ui = q.get("ui");
  if (!DILLER.includes(ui)) { try { ui = JSON.parse(localStorage.getItem("aicomics.ui")); } catch {} }
  if (!DILLER.includes(ui)) ui = (navigator.language || "tr").slice(0, 2);
  if (!DILLER.includes(ui)) ui = "tr";
  const $ = (id) => document.getElementById(id);
  function ciz() {
    const T = L[ui];
    document.documentElement.lang = ui;
    document.title = "Livrino — " + T.title;
    $("baslik").textContent = T.title;
    $("geri").setAttribute("aria-label", T.back);
    const m = $("icerik");
    m.replaceChildren();
    for (const [bas, sorular] of T.s) {
      const h = document.createElement("h2"); h.textContent = bas; m.append(h);
      for (const [soru, cevap] of sorular) {
        const d = document.createElement("details");
        const s = document.createElement("summary"); s.textContent = soru;
        const c = document.createElement("div"); c.className = "cevap"; c.innerHTML = cevap;
        d.append(s, c); m.append(d);
      }
    }
    const a = document.createElement("p"); a.className = "alt";
    a.append(T.alt); const l = document.createElement("a"); l.href = "mailto:" + M; l.textContent = M; a.append(l); m.append(a);
    $("dil").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dil === ui)));
  }
  for (const d of DILLER) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.dil = d; b.textContent = d.toUpperCase();
    b.addEventListener("click", () => { ui = d; ciz(); });
    $("dil").append(b);
  }
  $("geri").addEventListener("click", () => { if (history.length > 1) history.back(); else location.href = "index.html"; });
  ciz();
})();
