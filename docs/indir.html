<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livrino — Google Play'den indir</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#7A1E24;color:#F0E6D6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-family:Georgia,serif;font-size:56px;margin:0 0 8px;letter-spacing:2px}
p{font-size:18px;margin:6px 0}
a.btn{display:inline-block;margin-top:28px;background:#F0E6D6;color:#7A1E24;font-weight:700;font-size:22px;padding:18px 28px;border-radius:16px;text-decoration:none}
small{display:block;margin-top:18px;opacity:.8}
</style>
</head>
<body>
<h1>LIVRINO</h1>
<p>Klasikler çizgi roman olarak · 4 dil · sesli</p>
<p>Classics as comics · 4 languages · audio</p>
<a class="btn" id="git" href="https://play.google.com/store/apps/details?id=com.livrino.app">Google Play'de aç · Open in Google Play</a>
<small>Açılmazsa düğmeye dokunun · If nothing happens, tap the button</small>
<script>
/* Taner 21.11: Instagram/TikTok içi tarayıcı play.google.com'u açamıyor → Android'de Play Store uygulamasını doğrudan aç. */
(function(){
  var web='https://play.google.com/store/apps/details?id=com.livrino.app';
  if(!/Android/i.test(navigator.userAgent)){ location.replace(web); return; }
  var intent='intent://details?id=com.livrino.app#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url='+encodeURIComponent(web)+';end';
  document.getElementById('git').href=intent;
  setTimeout(function(){ location.href=intent; }, 150);
})();
</script>
</body>
</html>
