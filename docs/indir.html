<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livrino — Google Play'den indir</title>
<meta name="description" content="Livrino'yu Google Play'den indir: dünya klasikleri çizgi roman olarak, kendi dil seviyende.">
<link rel="canonical" href="https://livrino.app/indir">
<meta name="robots" content="noindex">
<meta name="robots" content="noindex">
<!-- livrino-tema 2026-11 -->
<style>

body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#6E1A21;color:#FFFCF6;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font:400 56px/1 Georgia,"Times New Roman",serif;margin:0 0 14px;letter-spacing:.04em}
p{font-size:18px;margin:6px 0;color:#F3E6E2}
a.btn{display:inline-block;margin-top:28px;background:#E9B44C;color:#1F1A1C;font-weight:800;font-size:21px;padding:18px 28px;border-radius:18px;text-decoration:none}
a.btn:focus-visible{outline:3px solid #FFFCF6;outline-offset:3px}
small{display:block;margin-top:18px;color:#E6CFCB}

</style>
</head>
<body>
<h1>LIVRINO</h1>
<p>Klasikler çizgi roman olarak · 4 dil · sesli</p>
<p>Classics as comics · 4 languages · audio</p>
<a class="btn" id="git" href="https://play.google.com/store/apps/details?id=com.livrino.app">Google Play'de aç · Open in Google Play</a>
<small>Açılmazsa düğmeye dokunun · If nothing happens, tap the button</small>
<script>
/* Taner 21.11: Instagram/TikTok içi tarayıcı play.google.com'u açamıyor → Android'de Play Store uygulamasını doğrudan aç.
   Taner 22.11 (sosyal rapor): ?k=ig|tt|yt|... kaynağı Play referrer'ına (UTM) aktarılır; Play Console edinim raporunda kaynak görünür. */
(function(){
  var izinli={ig:'instagram',tt:'tiktok',yt:'youtube',q:'quora',x:'x',fb:'facebook',ogr:'ogretmen',site:'site',qr:'qr'};
  var k=(new URLSearchParams(location.search).get('k')||'').toLowerCase();
  var kaynak=izinli[k]||'site';
  var ref='utm_source='+kaynak+'&utm_medium='+(kaynak==='site'?'web':'social')+'&utm_campaign=organik';
  var id='com.livrino.app';
  var web='https://play.google.com/store/apps/details?id='+id+'&referrer='+encodeURIComponent(ref);
  var btn=document.getElementById('git');
  btn.href=web;
  if(!/Android/i.test(navigator.userAgent)){ location.replace(web); return; }
  var intent='intent://details?id='+id+'&referrer='+encodeURIComponent(ref)+'#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url='+encodeURIComponent(web)+';end';
  btn.href=intent;
  setTimeout(function(){ location.href=intent; }, 150);
})();
</script>
</body>
</html>
